name: Build CS2 Plugin

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AOGTrollPlugin/AOGTrollPlugin.csproj
      - name: Build Release
        run: dotnet build AOGTrollPlugin/AOGTrollPlugin.csproj --no-restore -c Release
      - name: Package plugin
        run: |
          mkdir -p package/AOGTrollPlugin
          cp AOGTrollPlugin/bin/Release/net10.0/AOGTrollPlugin.dll package/AOGTrollPlugin/
          cp AOGTrollPlugin/bin/Release/net10.0/AOGTrollPlugin.deps.json package/AOGTrollPlugin/
          cp -r AOGTrollPlugin/bin/Release/net10.0/lang package/AOGTrollPlugin/
          cd package && zip -r ../AOGTrollPlugin.zip AOGTrollPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: AOGTrollPlugin
          path: AOGTrollPlugin.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AOGTrollPlugin.zip --title "AOGTrollPlugin $GITHUB_REF_NAME" --generate-notes
